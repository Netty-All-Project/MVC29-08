{% extends "base.html" %}
{% block content %}
<h1>รายชื่อสมาชิก</h1>
<table>
  <thead>
    <tr><th>ID</th><th>ชื่อ</th><th>บทบาทปัจจุบัน</th><th>สถานะ</th></tr>
  </thead>
  <tbody>
    {% for m in members %}
    <tr>
      <td>{{ m.id }}</td>
      <td>{{ m.name }}</td>
      <td>{{ m.role.value }}</td>
      <td>{% if m.active %}<span class="badge badge-APPROVED">Active</span>{% else %}<span class="badge badge-CANCELLED">Inactive</span>{% endif %}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
