<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends Forever — Change Request</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#f5f7fa; color:#333; margin:0; }
    nav { background:#2c3e50; color:#fff; padding:12px 24px; display:flex; align-items:center; gap:24px; }
    nav a { color:#ecf0f1; text-decoration:none; font-weight:500; }
    nav a:hover { text-decoration:underline; }
    .actor-badge { margin-left:auto; background:#16a085; padding:4px 12px; border-radius:4px; font-size:.85em; }
    main { max-width:900px; margin:32px auto; padding:0 16px; }
    h1 { color:#2c3e50; }
    .flash { padding:10px 16px; border-radius:4px; margin-bottom:16px; }
    .flash.success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
    .flash.error   { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:6px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.1); }
    th { background:#2c3e50; color:#fff; padding:10px 14px; text-align:left; }
    td { padding:10px 14px; border-bottom:1px solid #eee; }
    tr:last-child td { border-bottom:none; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.8em; font-weight:600; }
    .badge-PENDING   { background:#fff3cd; color:#856404; }
    .badge-APPROVED  { background:#d4edda; color:#155724; }
    .badge-REJECTED  { background:#f8d7da; color:#721c24; }
    .badge-CANCELLED { background:#e2e3e5; color:#383d41; }
    .btn { display:inline-block; padding:8px 18px; border-radius:4px; border:none; cursor:pointer; font-size:.9em; text-decoration:none; }
    .btn-primary  { background:#2980b9; color:#fff; }
    .btn-danger   { background:#c0392b; color:#fff; }
    .btn-success  { background:#27ae60; color:#fff; }
    .btn-secondary { background:#95a5a6; color:#fff; }
    .btn:hover { opacity:.85; }
    .card { background:#fff; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.1); padding:20px; margin-bottom:16px; }
    select, input[type=submit] { padding:8px 12px; border-radius:4px; border:1px solid #ccc; }
  </style>
</head>
<body>
<nav>
  <strong>Friends Forever CR</strong>
  <a href="{{ url_for('member.index') }}">หน้าหลัก</a>
  <a href="{{ url_for('member.list_members') }}">สมาชิก</a>
  <a href="{{ url_for('req.list_requests') }}">คำขอ</a>
  <a href="{{ url_for('req.create_request') }}">+ สร้างคำขอ</a>
  {% if actor %}
  <span class="actor-badge">ใช้งานเป็น: {{ actor.name }} ({{ actor.role.value }})</span>
  {% else %}
  <span class="actor-badge" style="background:#c0392b;">ยังไม่เลือกตัวตน</span>
  {% endif %}
</nav>
<main>
  {% for cat, msgs in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ cat }}">{{ msgs }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
